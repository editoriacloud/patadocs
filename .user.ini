; Used by PHP-FPM / FastCGI hosts (cPanel "MultiPHP"). Ignored by mod_php.
; Raise these if you need bigger documents — they cannot exceed your host's own limits.
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
memory_limit = 256M
display_errors = 0
session.cookie_httponly = 1
